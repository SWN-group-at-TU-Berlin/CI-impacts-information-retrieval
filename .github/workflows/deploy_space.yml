name: Deploy Hugging Face Space

# Pushes the web demo (hf_space/) and the pipeline code to the Hugging Face Space repository.
# Repository settings needed:
#   - secret   HF_DEPLOY_TOKEN : Hugging Face token with write access to the Space
#   - variable HF_SPACE_ID     : id of the Space, e.g. <user or org>/ci-impacts-extraction
on:
  push:
    branches:
    - hf-space
  workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
    - name: Assemble the Space repository
      shell: bash
      run: |
        mkdir space_repo
        cp -r src configs ner_patterns.jsonl examples hf_space LICENSE.md space_repo/
        mkdir -p space_repo/docs && cp docs/extracted_features.md space_repo/docs/
        # README with the Space config (frontmatter) and requirements.txt must be at the root of the Space repository
        cp hf_space/README.md space_repo/README.md
        # direct dependencies only, without gradio/spaces: the Space build installs these itself with its own pins
        python3 hf_space/make_requirements.py > space_repo/requirements.txt
        cat space_repo/requirements.txt
        find space_repo -name "__pycache__" -prune -exec rm -rf {} +
    - name: Upload to the Space
      shell: bash
      env:
        HF_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
        HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
      run: |
        if [ -z "$HF_SPACE_ID" ]; then
          echo "::error::Repository variable HF_SPACE_ID is empty: set it under Settings > Secrets and variables > Actions > Variables (not Secrets), e.g. <owner>/ci-impacts-extraction"
          exit 1
        fi
        if [ -z "$HF_TOKEN" ]; then
          echo "::error::Repository secret HF_DEPLOY_TOKEN is empty: set it under Settings > Secrets and variables > Actions > Secrets"
          exit 1
        fi
        uvx --from "huggingface_hub[cli]" hf upload "$HF_SPACE_ID" space_repo . \
          --repo-type space --delete "*" --commit-message "deploy ${GITHUB_SHA::7}"
