# User configuration of the CI impact extraction pipeline, read by src/settings.py
#
# - Relative paths are resolved from the project root (the folder with pyproject.toml), absolute paths are used as they are.
#   "~" is expanded to the home directory.
# - Every entry can be overwritten by an environment variable or an entry in the .env file of the project root
#   with the same name, e.g. `LLM1_BASE_URL=http://gpu-node-07:8000/v1`.
# - Secrets (VLLM_API_KEY, HUGGINGFACE_TOKEN) do not belong here, set them in .env (see .env_example).
# - To use another config file, set the environment variable CI_IMPACTS_CONFIG=<path to yaml file>.

# --- Data -------------------------------------------------------------------------------------------------------
# input documents: <PATH_DATA>/text_sources/*.pdf and <PATH_DATA>/text_sources/text_sources_html.csv (web pages)
# cleaned documents are stored in <PATH_DATA>/parsed_documents
PATH_DATA: ../data
# extracted records (csv per document) of the pipeline
PATH_RESULTS: ../results
# log files (logs_<module>.log)
PATH_LOGS: ../logs

# --- Models stored on disk --------------------------------------------------------------------------------------
# Docling models (layout, OCR) for the PDF processing, see README "Docling models"
DOCLING_ARTIFACTS: ../docling_artifacts
# spaCy pipeline (en_core_web_trf + merge_entities + merge_noun_chunks) for the NER pre-filter,
# created automatically on first use if it does not exist, see README "spaCy model pipeline"
SPACY_MODEL_PIPELINE: spacy_model_pipeline
# Hugging Face cache for the translation models (Helsinki-NLP/opus-mt-*-en),
# null: default cache of Hugging Face (~/.cache/huggingface/hub or $HF_HOME/hub)
HF_CACHE_DIR: null

# --- LLMs served by vLLM (OpenAI-compatible API), see run_scripts/serve_vllm_*.sbatch ------------------------------
# the pipeline runs on the same GPU node as the servers (localhost)
LLM1_BASE_URL: http://localhost:8000/v1   # LLM 1 (extraction)
JUDGE_BASE_URL: http://localhost:8001/v1  # LLM-as-a-judge
LLM1_MODEL: openai/gpt-oss-20b            # served model name, see `vllm serve --served-model-name`
JUDGE_MODEL: google/gemma-4-31B-it        # served model name, see `vllm serve --served-model-name`
