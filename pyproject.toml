[project]
name = "ci-impacts-llm"
version = "0.1.0"
description = ""
authors = [
    {name = "Anna Buch", email = "anna.buch@tu-berlin.de"},
]

# stick to python 3.12 as CUDA versoins on HPC (12.1, 12.2) are only compatible with python 3.12
requires-python = "==3.12.0"

readme = "README.md"
dependencies = [
  "ipykernel>=7.2.0",
  "jupyter>=1.1.1",
  "langdetect>=1.0.9",
  "langchain-docling>=2.0.0",
  "numpy>=1.26.4",
  "pandas>=2.3.3",
  "pdfminer>=20191125",
  "pdfminer-six>=20260107",
  "pydantic>=2.12.5",
  "spacy>=3.8.14",
  "spacy-curated-transformers==0.3.1",
  "peft>=0.18.1",
  "vllm>=0.11.0",
  "sentencepiece>=0.2.1",
  "tiktoken>=0.12.0",
  "tokenizers>=0.22.2",
  "torch==2.8.0",
  "transformers==5.5.3",
  "transformers[sentencepiece]>=5.4.0",
  "geopy>=2.4.1",
  "plotly>=6.7.0",
  "bitsandbytes>=0.49.2",
]


