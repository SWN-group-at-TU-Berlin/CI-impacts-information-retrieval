# on HPC w geollm submodule, py>=3.10, and pytorch dropped support for cuda12.8 -> use pytorch for cuda 126 instead (see HPC ISIS dicsussion ):
    # !uv pip install https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu128torch2.7-cp310-cp310-linux_x86_64.whl
    # "torch<=2.8.0",

## for py==3.12.*
#    "cmake>=4.2.0",
#     "accelerate>=1.11.0",


[tool.ruff]
line-length = 180

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# see, https://docs.astral.sh/ruff/rules
select = [
    # defaults
    "F",    # Pyflakes
    "E",    # pycodestyle Error

    # additional
    "A",    # not shadow built-in functions
    "I",    # isort imports
    "N",    # check for PEP8 naming conventions
    "W",    # pycodestyle Warning

    # clean docstrings
    "D201", "D207", "D208", "D209", "D210", "D214", "D215", "D300", "D403",

    # auto-remove unused 'noqa' comments
    "RUF100", "RUF101",
]

ignore = [
    # too complex function
    "C901",
    # bare except
    "E714",
    "I001",
    # line too long
    "E501"
]
fixable = ["ALL"]
exclude = [".venv", ".ipynb", "versioneer.py", "*_cache"]

[tool.uv]
package = true
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'" ]

# [tool.uv.workspace]
# members = ["submodules/geollama",]
# [tool.uv.sources]
# geollama = { workspace = true }

## define as independent sub-projects with inter-package dependency (here geollama)
[tool.uv.sources]
# geollama = { path = "./submodules/geollama" }
accelerate = { url = "https://files.pythonhosted.org/packages/15/33/b6b4ad5efa8b9f4275d4ed17ff8a44c97276171341ba565fdffb0e3dc5e8/accelerate-0.33.0-py3-none-any.whl" }
# torch = { url = "https://files.pythonhosted.org/packages/19/17/e377a460603132b00760511299fceba4102bd95db1a0ee788da21298ccff/torch-2.9.1-cp312-cp312-manylinux_2_28_x86_64.whl" }
# torch = [{url = "https://download.pytorch.org/whl/cpu/torch-1.10.0%2Bcpu-cp39-cp39-linux_x86_64.whl", markers = "sys_platform == 'linux'"},]
# torch = { index = "pytorch-cu126" }
# torchvision = { index = "pytorch-cu126" }
# flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu126torch2.6-cp312-cp312-linux_x86_64.whl" }


# NOTE: need manylinux wheel file: torch = { url = "https://download.pytorch.org/whl/torch/torch-2.6.0+cu124-cp312-cp312-linux_x86_64.whl" }
# Workaround to load Cuda 12.8 on cluster, but build pytorch needs currently to build against cuda 12.6 (see HPC ISIS discussion)
## The explicit = true setting is crucial. It tells uv to only use this specific index for torch, preventing other dependencies from trying to install from the PyTorch site.

[[tool.uv.index]]
name = "pytorch-cu126"
# url = "https://download.pytorch.org/whl/cu126"
url =  "https://download.pytorch.org/whl/cu126/torch-2.9.1%2Bcu126-cp312-cp312-linux_x86_64.whl"
explicit = true





