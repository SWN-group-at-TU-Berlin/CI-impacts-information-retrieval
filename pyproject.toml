readme = "README.md"
dependencies = [
    "accelerate>=1.11.0",
    "bitsandbytes>=0.48.2",
    "cmake>=4.2.0",
    "deepspeed>=0.18.2",
    "docling>=2.34.0",
    "fastchat>=0.1.0",
    "flash-attn",
    "fschat[model-worker,webui]>=0.2.36",
    "fuzzywuzzy>=0.18.0",
    "instructor>=1.12.0",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "jinja2>=3.1.6",
    "langchain>=1.0.8",
    "langchain-docling>=2.0.0",
    "langdetect>=1.0.9",
    "langextract>=1.1.1",
    "ninja>=1.13.0",
    "nlpcloud>=1.1.47",
    "nltk>=3.9.2",
    "numpy>=2.3.4",
    "ollama>=0.5.4",
    "packaging>=25.0",
    "pandas>=2.3.3",
    "pgai[vectorizer-worker]>=0.12.1",
    "pgvector>=0.4.1",
    "pip>=25.3",
    "protobuf>=6.33.5",
    "psutil>=7.2.1",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=23.0.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.11.0",
    "ruff>=0.15.5",
    "rust>=1.3.1",
    "sacremoses>=0.1.1",
    "sentencepiece>=0.2.1",
    "spacy>=3.8.11",
    "spacy-curated-transformers>=0.3.1",
    "sqlalchemy>=2.0.44",
    "tiktoken>=0.12.0",
    "torch==2.8",
    "transformers>=4.57.1",
    "unidecode>=1.4.0",
    "unstructured[all-docs]>=0.18.18",
